name: LoveTweaks
version: '${project.version}'
main: me.lovelace.loveTweaks.LoveTweaks
api-version: '26.3'
depend: [LoveCore, LoveEssential]
softdepend: [PlaceholderAPI, ItemsAdder, LoveChatFilter]

commands:
  scrollcancel:
    description: Отменить перемещение по свитку
    usage: /scrollcancel
  lovetweaksadmin:
    description: Команды администратора LoveTweaks
    aliases: [lovetweaks]
    usage: /lovetweaksadmin <reload|givescroll|givecoordscroll|herald bind/unbind/clear|blacksmith create/bind/unbind/open|lunge [ник]>
    permission: lovetweaks.admin
    permission-message: ""
