name: LoveTweaks
version: '${project.version}'
main: me.lovelace.loveTweaks.LoveTweaks
api-version: '26.2'
depend: [LoveCore, LoveEssential]
softdepend: [PlaceholderAPI, Citizens, ItemsAdder, LoveChatFilter, ReviveMe]

commands:
  scrollcancel:
    description: Отменить перемещение по свитку
    usage: /scrollcancel
  lovetweaksadmin:
    description: Команды администратора LoveTweaks
    aliases: [lovetweaks]
    usage: /lovetweaksadmin <reload|givescroll|givecoordscroll|herald bind/unbind/clear>
    permission: lovetweaks.admin
    permission-message: ""
