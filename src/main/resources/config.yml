# ─── Потеря и повреждение предметов при выбрасывании ─────────────────────────
item-drop-loss:
  enabled: true
  # Базовый шанс потери обычного предмета (без прочности)
  lose-chance: 0.15
  # Шанс полного уничтожения стака предметов при выбросе (очень маленький, 1%)
  complete-stack-loss-chance: 0.01
  # Шанс поломки/повреждения предмета с прочностью при падении
  break-chance: 0.20
  # Множитель шанса для игроков с низким уровнем вежливости в LoveBehavior
  terrible-politeness-multiplier: 1.5
  # Симметричный множитель для высокой вежливости (>=5) или доброго стиля игры (топ-ступень) —
  # 0.5 = вдвое реже. Не действует, если LoveBehavior не установлен.
  good-standing-multiplier: 0.5
  break-message: '&cВаш предмет сломался при падении!'
  damage-message: '&eВаш предмет повредился при падении!'
  lose-message: '&7Ваш предмет потерялся при падении!'
  stack-partial-lose-message: '&7Часть предметов (<count> шт.) потерялась при падении!'

# ─── Автоматическое возрождение игрока ────────────────────────────────────────
auto-respawn:
  # Мгновенно возрождать игрока после гибели и при повторном входе на сервер
  enabled: true
  # 2026-09-26: раньше было жёстко 1 тик — из-за этого форс-респавн иногда обгонял
  # собственную пост-смертную обработку сторонних плагинов (ReviveMe/CMI: keep-inventory,
  # death-chest, снятие "даунстейта"), которые тоже планируют свою логику на 1 тик вперёд.
  # Если наш респавн срабатывал первым, isDead() у игрока становился false раньше, чем
  # сторонний плагин успевал реально выдать выпавшие предметы на землю — предметы молча
  # пропадали. 5 тиков (0.25 сек) — небольшой запас, чтобы чужая задача c 1-тиковой
  # задержкой гарантированно отработала первой, respawn при этом всё ещё ощущается мгновенным.
  delay-ticks: 5

# ─── Фикс пропажи инвентаря ReviveMe (Downed → окончательная смерть) ──────────
# 2026-09-27: при downed_keep_inventory: false у ReviveMe предметы после окончательной смерти
# должны падать на землю, а по факту молча исчезали — ReviveMe успевает очистить/подменить
# инвентарь ДО того, как наш PlayerDeathEvent увидит его состояние (та же гонка, что
# auto-respawn.delay-ticks выше пытается обойти таймингом, только здесь надёжнее решить снимком).
# Модуль сам снимает независимую копию инвентаря в момент ухода в Downed (по родному событию
# ReviveMe, а не по PlayerDeathEvent) и дропает именно её при финальной смерти — без гонки по
# тикам с чужой пост-смертной обработкой.
revive-inventory-fix:
  enabled: true
  # Работать только если ReviveMe реально установлен и включён
  require-reviveme: true
  # Режим выпадения предметов:
  #   NATURAL — спавнит предметы прямо в мир (world.dropItemNaturally). Рекомендуемый и самый надёжный режим:
  #             полностью защищён от того, что DeluxeCombat, ReviveMe или CMI очистят event.getDrops()
  #             или установят keepInventory: true.
  #   EVENT_DROPS — передаёт предметы через ванильный список PlayerDeathEvent.getDrops().
  #   BOTH — спавнит предметы в мир и добавляет в event.getDrops().
  drop-mode: NATURAL
  # Удалять ли снимок сразу после успешного оживления (revive). Если true — при оживлении игрок
  # оставляет вещи себе, и снимок удаляется из памяти.
  remove-on-revive: true
  # Очищать ли снимок при выходе игрока с сервера. По умолчанию false, так как ReviveMe убивает
  # вышедшего раненого игрока (disconnect_kill), и вещи должны выпасть.
  clear-snapshot-on-quit: false
  # Очищать ли живой инвентарь игрока при его окончательной смерти в ранении.
  # Гарантирует, что игрок не возродится со своими вещами, даже если сторонний плагин
  # форсировал keepInventory: true на смерть.
  clear-inventory-on-death: true
  # Дропать ли инвентарь даже при отсутствии предварительного снимка (например, если перезагрузили
  # плагин во время ранения), если игрок на момент смерти числится раненым в ReviveMeAPI.
  force-drop-on-downed-death: true
  # Дропать ли опыт умершего тяжелораненого игрока (по умолчанию false)
  drop-exp: false
  # 2026-09-29: игрок вышел с сервера в нокауте и после входа стал бессмертным, а мобы его
  # игнорировали. Пока игрок ранен, ReviveMe держит его неуязвимым (а ванильные мобы не берут
  # неуязвимых игроков в цель), и этот флаг Invulnerable сохраняется в данных игрока. Если при
  # выходе ReviveMe его не снял, состояние переезжает в следующую сессию. Чистить нужно именно
  # в момент выхода, до сохранения данных, поэтому защита работает на PlayerQuitEvent.
  quit-guard:
    # Снимать неуязвимость у вышедшего в нокауте игрока и подчищать остаток при следующем входе
    enabled: true
    # Убивать вышедшего в нокауте игрока (защита от выхода, чтобы избежать смерти). Вещи при этом
    # выпадают через обычный путь смерти в нокауте. false — игрок вернётся живым, но уже без
    # неуязвимости.
    kill-on-quit: true
  # Время жизни снимка в секундах на случай, если ни смерть, ни оживление не были зафиксированы
  snapshot-timeout-seconds: 300
  # Приоритет обработчика смерти (HIGHEST рекомендуется для опережения или завершения логики смерти)
  death-event-priority: HIGHEST
  # Подробные логи работы модуля в консоль
  debug: false


