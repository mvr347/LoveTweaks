  help-givecoordscroll: '&b/lovetweaksadmin givecoordscroll <игрок> &7— Выдать свиток телепортации по координатам'
  help-givepurification: '&b/lovetweaksadmin givepurification <игрок> [кол-во] &7— Выдать зелье очищения'
  help-herald: '&b/lovetweaksadmin herald <bind|unbind|clear|open> &7— Управление Королевским Глашатаем'
  help-footer: '&8========================================='
  usage-givescroll: '&eИспользование: &f/lovetweaksadmin givescroll <игрок>'
  usage-givecoordscroll: '&eИспользование: &f/lovetweaksadmin givecoordscroll <игрок>'
  usage-givepurification: '&eИспользование: &f/lovetweaksadmin givepurification <игрок> [количество]'
  usage-herald: '&eИспользование: &f/lovetweaksadmin herald <bind|unbind|clear|open>'
  reload-done: '&aLoveTweaks конфиг перезагружен!'
