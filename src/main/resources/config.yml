# ─── Потеря и повреждение предметов при выбрасывании ─────────────────────────
item-drop-loss:
  enabled: true
  # Базовый шанс потери обычного предмета (без прочности)
  lose-chance: 0.15
  # Шанс полного уничтожения стака предметов при выбросе (очень маленький, 1%)
  complete-stack-loss-chance: 0.01
  # Шанс поломки/повреждения предмета с прочностью при падении
  break-chance: 0.20
  # Множитель шанса для игроков с низким уровнем вежливости в LoveBehavior
  terrible-politeness-multiplier: 1.5
  # Симметричный множитель для высокой вежливости (>=5) или доброго стиля игры (топ-ступень) —
  # 0.5 = вдвое реже. Не действует, если LoveBehavior не установлен.
  good-standing-multiplier: 0.5
  break-message: '&cВаш предмет сломался при падении!'
  damage-message: '&eВаш предмет повредился при падении!'
  lose-message: '&7Ваш предмет потерялся при падении!'
  stack-partial-lose-message: '&7Часть предметов (<count> шт.) потерялась при падении!'

# ─── Автоматическое возрождение игрока ────────────────────────────────────────
auto-respawn:
  # Мгновенно возрождать игрока после гибели и при повторном входе на сервер
  enabled: true

