  scroll-given-sender: '&aСвиток телепортации выдан игроку &e<player>&a.'
  scroll-given-target: '&6Вы получили &eСвиток телепортации&6!'
  purification-given-sender: '&aЗелье очищения (<amount> шт.) выдано игроку &e<player>&a.'
  purification-given-target: '&bВы получили &eЗелье очищения&b!'
  coord-scroll-not-found: '&cСвиток с id &e<id>&c не найден в coord-teleport-scroll.scrolls.'
  citizens-missing: '&cCitizens не установлен или не включён.'
  npc-not-selected: '&cВыберите NPC (&e/npc select&c) или посмотрите на него и повторите команду.'
  herald-npc-bound: '&aNPC Глашатая привязан: &e<npc>'
  herald-npc-unbound: '&aNPC Глашатая отвязан.'
  herald-cleared: '&aГолос Королевства сброшен.'
  herald-opened: '&aМеню Глашатая открыто для &e<player>&a.'

ender-chests:
  as-normal-chests: true

enchantments:
  disable-mending: true
  disable-all-enchantments: false

hunger:
  extra-exhaustion-per-second: 0.25
  saturation-multiplier: 0.5

milk:
  disable-milk: true
  # Зелье очищения — кастомный предмет, снимающий все активные эффекты при употреблении.
  # Поддерживает текстуры ItemsAdder, кулдаун (30 сек по умолчанию), частицы и крафт.
  purification-potion:
    material: POTION
    itemsadder-item: '' # ID предмета из ItemsAdder (например: 'custom_items:purification_potion')
    custom-model-data: 0
    name: '&bЗелье очищения'
    lore:
      - '&7Снимает все активные эффекты'
      - '&8Кулдаун: &f30 сек.'
    # Кулдаун между использованиями зелья в секундах
    cooldown-seconds: 30
    # Сообщение при попытке использовать во время кулдауна
    cooldown-message: '&cВы сможете использовать зелье очищения через <seconds> сек.'
    # Сообщение при успешном употреблении
    purification-message: '&bВы ощущаете очищение...'
    # Список эффектов, которые НЕ сбрасываются зельем очищения (например: BAD_OMEN, RAID_OMEN, TRIAL_OMEN)
    ignored-effects:
      - BAD_OMEN
      - RAID_OMEN
      - TRIAL_OMEN
    # Рецепт крафта на верстаке (бесформенный)
    recipe:
      enabled: true
      ingredients:
        - GHAST_TEAR
        - FERMENTED_SPIDER_EYE
        - NETHER_WART

# ─── Зельеварение и варочные стойки ──────────────────────────────────────────
# Полное отключение варочных стоек и варки зелий:
# - Блокировка крафта варочной стойки и всех рецептов варки зелий в ней
# - Блокировка размещения и использования варочных стоек
# - Удаление варочных стоек при генерации мира (структуры, деревни, иглу, корабли Края) и из сундуков
brewing:
  # Отключить варку любых зелий в варочной стойке
  disable-brewing: true
  # Отключить крафт варочной стойки
  disable-brewing-stand-craft: true
  # Отключить появление варочной стойки в мире (генерация в структурах, сундуки с лутом, установка блоков)
  disable-brewing-stand-world: true
  # Отключить естественное появление и выпадение зелий в мире (лут сундуков, дроп с мобов/ведьм, бартер пиглинов, рыбалка, жители)
  disable-potion-natural-drops: true
  # Сообщение при попытке взаимодействовать с варочной стойкой, поставить или скрафтить её
  disabled-message: '&cЗельеварение и варочные стойки отключены на этом сервере.'

# ─── Ванильные ограничения (Жалобы, Достижения, Друзья) ─────────────────────
vanilla:
  # Полное отключение ванильных достижений (Advancements):
  # Прогресс критериев блокируется, оповещения в чат скрываются, а все достижения обнуляются.
  disable-advancements: true
  # Полное отключение ванильной системы жалоб (Chat Reporting):
  # Сообщения отправляются без криптографических подписей игрока (как системные),
  # что делает невозможным отправку жалобы в Mojang через меню паузы или кнопку 'P'.
  disable-chat-reports: true
  # Отключение команд ванильных жалоб, достижений и друзей
  disable-friends-and-reports: true
  # Сообщение при попытке использовать отключенную команду
  disabled-command-message: '&cВанильные жалобы, достижения и система друзей отключены на этом сервере.'
  # Список блокируемых команд
  blocked-commands:
    - 'report'
    - 'chatreport'
    - 'wreport'
    - 'friend'
    - 'friends'
    - 'f'
    - 'advancement'
    - 'advancements'

# ─── Королевский Глашатай ─────────────────────────────────────────────────────
# NPC (Citizens), у которого любой игрок может купить слот объявления. До
# "slots" объявлений активны одновременно; раз в минуту Глашатай зачитывает
# в общий чат одно из них по очереди (round-robin), так что при трёх занятых
# слотах каждое конкретное сообщение повторяется примерно раз в 3 минуты.
# Текст объявления: подписанная книга, вложенная в меню (берётся первая
# страница), либо ввод в чат. Перед публикацией текст проверяется
# LoveChatFilter (см. его config.yml) — если словится плохое слово,
# объявление не публикуется, а деньги не возвращаются.
herald:
  enabled: true
  # ID NPC Citizens, привязывается командой /lovetweaksadmin herald bind (нужно смотреть на NPC)
  npc-id: -1
  npc-name: 'Глашатай Роберт'
  # Сколько объявлений может быть активно одновременно.
  slots: 3
  # Длительность объявления — игрок выбирает шагами duration-step-minutes
  # от min до max (кнопка-циклер в меню покупки).
  min-duration-minutes: 10
  max-duration-minutes: 60
  duration-step-minutes: 10
  # Максимальная длина текста объявления в символах.
  max-message-length: 50
  # Цена в единой валюте экосистемы (монеты LoveCore, см. его config.yml) — линейно
  # растёт с длительностью и длиной текста между min-cost (короткое, минимальная
  # длительность) и max-cost (максимум обоих). 50 = 5 iron_coin, 300 = 3 diamond_coin
  # при денежных номиналах LoveCore по умолчанию.
  min-cost: 50
  max-cost: 300

  gui:
    overview-title: '&6⚡ Королевский Глашатай'
    purchase-title: '&6⚡ Новое объявление'

    info:
      name: '&6Голос Королевства'
      lore:
        - '&7Оплаченное объявление транслируется'
        - '&7в общий чат по очереди с другими.'
        - '&7До &f<max> &7слотов одновременно.'

    slot-free:
      name: '&aСлот &f<index> &aсвободен'
      lore:
        - ''
        - '&aЛКМ &7— купить'

    slot-occupied:
      name: '&7Слот &f<index> &7занят'
      lore:
        - '&7Автор: &f<buyer>'
        - '&7Сообщение: &f<message>'
        - '&7Осталось: &f<remaining> мин.'

    # Слот книги: подсказка (когда текст ещё не задан)
    book-hint:
      name: '&eВложите подписанную книгу'
      lore:
        - ''
        - '&7Перетащите книгу в этот слот —'
        - '&7текст возьмётся с первой страницы'
        - '&7(до <max> символов).'

    # Слот книги: текст задан через книгу
    book-active:
      name: '&aТекст из книги'
      lore:
        - ''
        - '&7Текст объявления:'
        - '&f<message>'
        - ''
        - '&cПКМ &7— сбросить текст'

    # Слот книги: неактивен, так как текст задан через чат
    book-disabled:
      name: '&8Вложить книгу'
      lore:
        - ''
        - '&7Текст уже задан через чат.'
        - '&7Нажмите &fПКМ &7по кнопке чата,'
        - '&7чтобы сбросить его.'

    # Кнопка чата: подсказка (когда текст ещё не задан)
    write-chat-button:
      name: '&bНаписать в чат'
      lore:
        - ''
        - '&aЛКМ &7— ввести текст в чат'

    # Кнопка чата: текст задан через чат
    write-chat-active:
      name: '&aТекст из чата'
      lore:
        - ''
        - '&7Введённый текст:'
        - '&f<message>'
        - ''
        - '&aЛКМ &7— изменить текст'
        - '&cПКМ &7— сбросить текст'

    # Кнопка чата: неактивна, так как текст задан через книгу
    write-chat-disabled:
      name: '&8Написать в чат'
      lore:
        - ''
        - '&7Текст уже задан через книгу.'
        - '&7Нажмите &fПКМ &7по слоту книги,'
        - '&7чтобы сбросить его.'

    duration-button:
      name: '&eДлительность: &f<minutes> мин.'
      lore:
        - ''
        - '&7Текущая цена: <cost>'
        - '&aЛКМ &7— изменить (<min>–<max> мин.)'

    confirm-button:
      name: '&aОпубликовать объявление'
      lore:
        - ''
        - '&7Текст: &f<message>'
        - '&7Длительность: &f<minutes> мин.'
        - '&7Цена: <cost>'
        - ''
        - '&aЛКМ &7— подтвердить и оплатить'

    confirm-disabled:
      name: '&8Опубликовать объявление'
      lore:
        - ''
        - '&cСначала добавьте текст объявления'

    # Кнопка подтверждения, если у игрока не хватает монет
    confirm-no-funds:
      name: '&cОпубликовать объявление'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzYxODczMWUwNjMzNzlhZWJmODJmMWQ2NGM0MTljOTBkN2YwYzE2NDhjNTQ4ZTliNjE1MWIxYmFiYTY2ZDcyMyJ9fX0='
      lore:
        - ''
        - '&7Текст: &f<message>'
        - '&7Длительность: &f<minutes> мин.'
        - '&7Цена: <cost>'
        - ''
        - '&cНедостаточно монет для покупки'

    # Форматирование цены в физической валюте (монетах)
    currency:
      separator: '&7, '
      coins:
        netherite_coin:
          value: 1000
          one: '&f%img_netherite_coin% &8<amount> незеритовая монета'
          few: '&f%img_netherite_coin% &8<amount> незеритовые монеты'
          many: '&f%img_netherite_coin% &8<amount> незеритовых монет'
        diamond_coin:
          value: 100
          one: '&f%img_diamond_coin% &b<amount> алмазная монета'
          few: '&f%img_diamond_coin% &b<amount> алмазные монеты'
          many: '&f%img_diamond_coin% &b<amount> алмазных монет'
        gold_coin:
          value: 50
          one: '&f%img_gold_coin% &e<amount> золотая монета'
          few: '&f%img_gold_coin% &e<amount> золотые монеты'
          many: '&f%img_gold_coin% &e<amount> золотых монет'
        iron_coin:
          value: 10
          one: '&f%img_iron_coin% &f<amount> железная монета'
          few: '&f%img_iron_coin% &f<amount> железные монеты'
          many: '&f%img_iron_coin% &f<amount> железных монет'
        copper_coin:
          value: 1
