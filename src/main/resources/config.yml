  usage-main: '&eИспользование: &f/lovetweaks <reload|givescroll|givecoordscroll|herald>'
  usage-givescroll: '&eИспользование: &f/lovetweaks givescroll <игрок>'
  usage-givecoordscroll: '&eИспользование: &f/lovetweaks givecoordscroll <игрок> <id свитка>'
  usage-herald: '&eИспользование: &f/lovetweaks herald <bind|unbind|clear>'
  reload-done: '&aLoveTweaks конфиг перезагружен!'
  player-not-found: '&cИгрок &e<player>&c не найден или не в сети.'
  scroll-given-sender: '&aСвиток телепортации выдан игроку &e<player>&a.'
  scroll-given-target: '&6Вы получили &eСвиток телепортации&6!'
  coord-scroll-not-found: '&cСвиток с id &e<id>&c не найден в coord-teleport-scroll.scrolls.'
  citizens-missing: '&cCitizens не установлен или не включён.'
  npc-not-selected: '&cВыберите NPC (&e/npc select&c) или посмотрите на него и повторите команду.'
  herald-npc-bound: '&aNPC Глашатая привязан: &e<npc>'
  herald-npc-unbound: '&aNPC Глашатая отвязан.'
  herald-cleared: '&aГолос Королевства сброшен.'

ender-chests:
  as-normal-chests: true

enchantments:
  disable-mending: true
  disable-all-enchantments: false

hunger:
  extra-exhaustion-per-second: 0.25
  saturation-multiplier: 0.5

milk:
  disable-milk: true
  # Зелье очищения — крафтится из GHAST_TEAR + FERMENTED_SPIDER_EYE + NETHER_WART,
  # снимает все активные эффекты при употреблении.
  purification-potion:
    name: '&bЗелье очищения'
    lore:
      - '&7Снимает все активные эффекты'
      - '&8Сварено с кровью Нижнего мира'
  purification-message: '&bВы ощущаете очищение...'

# ─── Королевский Глашатай ─────────────────────────────────────────────────────
# NPC (Citizens), у которого любой игрок может купить слот объявления. До
# "slots" объявлений активны одновременно; раз в минуту Глашатай зачитывает
# в общий чат одно из них по очереди (round-robin), так что при трёх занятых
# слотах каждое конкретное сообщение повторяется примерно раз в 3 минуты.
# Текст объявления: подписанная книга, вложенная в меню (берётся первая
# страница), либо ввод в чат. Перед публикацией текст проверяется
# LoveChatFilter (см. его config.yml) — если словится плохое слово,
# объявление не публикуется, а деньги не возвращаются.
herald:
  enabled: true
  # ID NPC Citizens, привязывается командой /lovetweaks herald bind (нужно смотреть на NPC)
  npc-id: -1
  npc-name: ''
  # Сколько объявлений может быть активно одновременно.
  slots: 3
  # Длительность объявления — игрок выбирает шагами duration-step-minutes
  # от min до max (кнопка-циклер в меню покупки).
  min-duration-minutes: 10
  max-duration-minutes: 60
  duration-step-minutes: 10
  # Максимальная длина текста объявления в символах.
  max-message-length: 50
  # Цена в единой валюте экосистемы (монеты LoveCore, см. его config.yml) — линейно
  # растёт с длительностью и длиной текста между min-cost (короткое, минимальная
  # длительность) и max-cost (максимум обоих). 50 = 5 iron_coin, 300 = 3 diamond_coin
  # при денежных номиналах LoveCore по умолчанию.
  min-cost: 50
  max-cost: 300

  gui:
    overview-title: '&6⚡ Королевский Глашатай'
    purchase-title: '&6⚡ Новое объявление'

    info:
      name: '&6Голос Королевства'
      lore:
        - '&7Оплаченное объявление транслируется'
        - '&7в общий чат по очереди с другими.'
        - '&7До &f<max> &7слотов одновременно.'

    slot-free:
      name: '&aСлот &f<index> &aсвободен'
      lore:
        - ''
        - '&aЛКМ &7— купить'

    slot-occupied:
      name: '&7Слот &f<index> &7занят'
      lore:
        - '&7Автор: &f<buyer>'
        - '&7Сообщение: &f<message>'
        - '&7Осталось: &f<remaining> мин.'

    book-hint:
      name: '&eВложите подписанную книгу'
      lore:
        - ''
        - '&7Перетащите книгу в этот слот —'
        - '&7текст возьмётся с первой страницы'
        - '&7(до <max> символов).'
        - ''
        - '&7Можно забрать книгу обратно,'
        - '&7если передумали.'

    write-chat-button:
      name: '&bНаписать в чат'
      lore:
        - ''
        - '&aЛКМ &7— ввести текст в чат вместо книги'

    duration-button:
      name: '&eДлительность: &f<minutes> мин.'
      lore:
        - ''
        - '&7Текущая цена: &f<cost> монет'
        - '&aЛКМ &7— изменить (<min>–<max> мин.)'

    confirm-button:
      name: '&aОпубликовать объявление'
      lore:
        - ''
        - '&7Текст: &f<message>'
        - '&7Длительность: &f<minutes> мин.'
        - '&7Цена: &f<cost> монет'
        - '&aЛКМ &7— подтвердить и оплатить'

    confirm-disabled:
      name: '&8Опубликовать объявление'
      lore:
        - ''
        - '&cСначала добавьте текст объявления'

    messages:
      insufficient-funds: '&cНедостаточно монет для покупки (нужно <cost>).'
      too-long: '&cСлишком длинное сообщение (максимум <max> символов, у вас <length>).'
      empty-message: '&cОбъявление не может быть пустым.'
      rejected-profanity: '&cОбъявление отклонено фильтром чата — деньги не возвращаются.'
      published: '&aОбъявление опубликовано на <minutes> мин.!'
      chat-prompt: '&eВведите текст объявления в чат (до <max> символов), или "отмена":'
      chat-cancelled: '&7Ввод объявления отменён.'
      no-permission: '&cУ вас нет прав для этой команды.'
      wrong-book: '&cСюда можно вложить только подписанную книгу.'
      no-free-slots: '&cСейчас все слоты Глашатая заняты.'
      broadcast-format: '&6&l[Голос Королевства] &f<buyer>&7: &e<message>'

# ─── Потеря/поломка предметов при выбрасывании ────────────────────────────────
# Если у предмета есть прочность (durability) — применяется break-chance
# (предмет ломается и исчезает при падении). Иначе применяется lose-chance
# (предмет просто теряется/исчезает).
item-drop-loss:
  enabled: true
  lose-chance: 0.22
  break-chance: 0.33
  break-message: '&cВаш предмет сломался при падении!'
  lose-message: '&7Ваш предмет потерялся при падении!'

# ─── Свиток телепортации ──────────────────────────────────────────────────────
# ПКМ → игрок вводит ник цели в чат → 5-секундный отсчёт (отменяется движением,
# невидимостью или PvP-меткой любой из сторон) → телепортация к цели.
teleport-scroll:
  item:
    name: '&6✦ Свиток телепортации ✦'
    lore:
      - '&7Позволяет телепортироваться к игроку'
      - ''
      - '&eПКМ&7 — использовать свиток'
  messages:
    prompt: '&6✦ Введите ник игрока в чат &e(10 секунд)'
    timeout: '&c✗ Время вышло!'
    player-not-found: '&c✗ Игрок &e<player>&c не найден или не в сети!'
    cannot-target-self: '&c✗ Нельзя телепортироваться к себе!'
    target-afk: '&c✗ Игрок &e<player>&c АФК!'
    countdown-initiator: '&6✦ Телепортация через &e<seconds> сек&6... Не двигайтесь!'
    countdown-target: '&6✦ К вам телепортируется &e<player>&6... Не двигайтесь!'
    cancelled-initiator: '&c✗ Телепортация отменена! <reason>'
    cancelled-target: '&c✗ Телепортация отменена!'
    success-initiator: '&a✦ Телепортация выполнена!'
    success-target: '&e<player> &aтелепортировался к вам!'
    reason-moved-self: '(вы двигались)'
    reason-moved-target: '(<player> двигался)'
    reason-invisible-self: '(вы в невидимости)'
    reason-invisible-target: '(<player> в невидимости)'
    reason-pvp-self: '(вы в PvP)'
    reason-pvp-target: '(<player> в PvP)'

# ─── Свиток телепортации к координатам ────────────────────────────────────────
# В отличие от обычного свитка выше (телепорт к игроку), этот ведёт к заранее заданной
# в конфиге точке. ПКМ → отсчёт cast-time-seconds (отменяется движением/невидимостью/PvP,
# как и у обычного свитка) → телепортация. Выдаётся командой:
#   /lovetweaks givecoordscroll <игрок> <id>   (id — ключ из scrolls ниже)
#
# Лимиты безопасности ниже — общие для ВСЕХ точек ниже в scrolls и защищают от
# телепортации в шахту/пещеру, в небо или за пределы обжитой части карты, даже если
# кто-то из админов ошибётся в координатах при добавлении новой точки.
coord-teleport-scroll:
  enabled: true
  # Длительность отсчёта перед телепортацией (секунды). 0 — телепортация мгновенно по ПКМ.
  cast-time-seconds: 5
  # Кулдаун повторного использования ОДНОГО И ТОГО ЖЕ id свитка одним игроком (секунды).
  # 0 — без кулдауна. Не мешает использовать сразу другой id.
  cooldown-seconds: 30

  # ─ Лимиты безопасности (проверяются для точки НАЗНАЧЕНИЯ каждого свитка) ───────
  limits:
    # Ниже этой высоты телепортация запрещена — защита от прыжка в шахты/пещеры/бедрок.
    min-y: -32
    # Выше этой высоты телепортация запрещена — защита от "полёта" в абсурдную высоту.
    max-y: 320
    # Точка назначения обязана лежать внутри текущей границы мира (world border).
    respect-world-border: true
    # Доп. ограничение: максимальное расстояние по горизонтали (в блоках) от спавна мира
    # до точки назначения. 0 — не ограничивать (полагаться только на world border выше).
    max-distance-from-spawn: 0
    # Если список не пуст — координатные свитки работают только в перечисленных мирах.
    # Пусто = разрешены все загруженные миры.
    allowed-worlds: []

  messages:
    no-permission: '&cУ вас нет прав на этот свиток!'
    scroll-unknown: '&cЭтот свиток больше не действителен (удалён из конфига).'
    on-cooldown: '&cЭтот свиток будет готов через &e<seconds> сек&c!'
    destination-blocked: '&cТочка назначения этого свитка временно недоступна (проверьте лимиты в конфиге)!'
    countdown: '&6✦ Телепортация через &e<seconds> сек&6... Не двигайтесь!'
    cancelled: '&c✗ Телепортация отменена! <reason>'
    success: '&a✦ Телепортация выполнена!'
    reason-moved: '(вы двигались)'
    reason-invisible: '(вы в невидимости)'
    reason-pvp: '(вы в PvP)'
    reason-dropped: '(свиток убран из руки)'

  # ─ Точки назначения — добавляйте сколько угодно, каждая под своим уникальным id ─
  scrolls:
    spawn:
      # Пустая строка — доступно всем без дополнительного права.
      permission: ''
      world: world
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
      item:
        material: PAPER
        name: '&b✦ Свиток телепортации: Спавн ✦'
        lore:
          - '&7Телепортирует вас на спавн'
          - ''
          - '&eПКМ&7 — использовать свиток'
    # Пример второй точки — скопируйте блок, смените id (ключ) и координаты.
    # arena:
    #   permission: 'lovetweaks.coordscroll.arena'
    #   world: world
    #   x: 100.0
    #   y: 70.0
    #   z: -200.0
    #   item:
    #     material: PAPER
    #     name: '&c✦ Свиток телепортации: Арена ✦'
    #     lore:
    #       - '&7Телепортирует вас на арену'

# ─── Стартовый набор ──────────────────────────────────────────────────────────
# Выдаётся один раз при самом первом заходе игрока на сервер.
first-join:
  enabled: true
  items:
    # teleport-scroll: true — выдаёт настоящий свиток телепортации (material/display-name/lore
    # игнорируются, используется предмет из items.TeleportScroll)
    - material: PAPER
      teleport-scroll: true
      amount: 1
    - material: IRON_SWORD
      amount: 1
      display-name: '&aНачальный меч'
      lore:
        - '&7Ваш первый меч на сервере'
    - material: COOKED_BEEF
      amount: 16
      display-name: '&6Запас еды'

# ─── Scoreboard ───────────────────────────────────────────────────────────────
scoreboard:
  # Название скорборда (§-коды или &-коды, всегда отображается как заголовок)
  title: '&FVOIDCORE'
  # Строка-разделитель между парами плейсхолдеров (по умолчанию пустая строка)
  separator: ''
  # Верхняя строка (первая строка тела, сразу под заголовком) и нижняя строка
  # (последняя строка, если скорборд включён). Обе автоматически центрируются
  # относительно самой широкой строки плейсхолдера — не нужно вручную
  # подбирать отступы пробелами.
  top: '&c✌ &7V O I D C O R E &c✌'
  bottom: '&c✌ &7V O I D C O R E &c✌'
  # Интервал обновления в тиках (20 = 1 секунда)
  update-interval: 20
  # Максимальное кол-во плейсхолдеров, которые игрок может включить одновременно.
  # Плейсхолдеры отображаются на скорборде парами (по 2 в ряд), каждая пара
  # завершается строкой-разделителем — при 8 плейсхолдерах получится ровно
  # 8 строк + 4 разделителя = 12 строк тела скорборда.
  max-placeholders: 8
  # Миры, в которых скорборд не отображается
  disabled-worlds:
    - world_nether
    - world_the_end

  # Плейсхолдеры скорборда — каждый плейсхолдер это одна строка.
  # requirement (необязательно): плейсхолдер блокируется в GUI и пропускается на
  #   скорборде, пока не выполнено условие.
  #     placeholder: PAPI-выражение для проверки, например '%clans_in_clan%'
  #     equals (необязательно): требуемое значение; если не указано — условие
  #       считается выполненным, если PAPI вернул непустой результат
  #     reason: причина блокировки, показывается в лore кнопки
  # sort-group: группирует плейсхолдеры по категориям для расположения в GUI
  #   /scoreboard (0=игрок, 5=пометка, 10=клан, 20=стиль игры, 30=статистика,
  #   35=дата/время) — порядок скорборда определяется самим игроком (ЛКМ/ПКМ),
  #   sort-group влияет только на раскладку кнопок в меню.
  placeholders:
    karma:
      display-name: '&eКарма'
      template: '&e⚖ &f%lovebehavior_politeness_points% &7очков кармы'
      lore:
        - '&7Очки кармы (вежливости) на сервере'
      sort-group: 0

    coords:
      display-name: '&bКоординаты'
      template: '&6x &b%player_x%&r, &6y &b%player_y%&r, &6z &b%player_z%'
      lore:
        - '&7Текущие координаты игрока'
      sort-group: 0

    playtime:
      display-name: '&bВремя на сервере'
      template: '&b⏱ &f%playtime_since_join% &7часов на сервере'
      lore:
        - '&7Время, проведённое на сервере'
      sort-group: 0

    suffix:
      display-name: '&dПометка'
      template: '&d✦ &f%lovesubnames_current% &7пометка'
      lore:
        - '&7Текущая пометка (суффикс) игрока'
      sort-group: 5
      requirement:
        placeholder: '%lovesubnames_current%'
        reason: '&7Нужна активная пометка'

    clan_tag:
      display-name: '&6Тег клана'
      template: '&6⚑ &f%clans_colored_tag% &7тег клана'
      lore:
        - '&7Тег вашего клана'
      sort-group: 10
      requirement:
        placeholder: '%clans_in_clan%'
        equals: 'true'
        reason: '&7Нужно состоять в клане'

    clan_name:
      display-name: '&6Клан'
      template: '&6⚑ &f%clans_name% &7название клана'
      lore:
        - '&7Полное название вашего клана'
      sort-group: 10
      requirement:
        placeholder: '%clans_in_clan%'
        equals: 'true'
        reason: '&7Нужно состоять в клане'

    clan_level:
      display-name: '&6Уровень клана'
      template: '&6◆ &f%clans_level% &7уровень клана'
      lore:
        - '&7Уровень вашего клана'
      sort-group: 10
      requirement:
        placeholder: '%clans_in_clan%'
        equals: 'true'
        reason: '&7Нужно состоять в клане'

    behavior:
      display-name: '&8Стиль игры'
      template: '&8☯ &f%lovebehavior_playstyle_name% &7стиль игры'
      lore:
        - '&7Ваш текущий стиль игры'
      sort-group: 20
      requirement:
        placeholder: '%lovebehavior_playstyle_name%'
        reason: '&7Нужен определённый стиль игры'

    kills:
      display-name: '&cУбийства'
      template: '&c⚔ &f%statistic_player_kills% &7убийств'
      lore:
        - '&7Количество убийств игроков'
      sort-group: 30

    deaths:
      display-name: '&7Смерти'
      template: '&c☠ &f%statistic_deaths% &7смертей'
      lore:
        - '&7Количество смертей'
      sort-group: 30

    mob_kills:
      display-name: '&aУбийства мобов'
      template: '&a⚔ &f%statistic_mob_kills% &7мобов'
      lore:
        - '&7Количество убитых мобов'
      sort-group: 30

    kd_ratio:
      display-name: '&eК/Д'
      template: '&e⚔ &f%kd_ratio% &7соотношение К/Д'
      lore:
        - '&7Соотношение убийств к смертям'
      sort-group: 30

    ping:
      display-name: '&7Пинг'
      template: '&7⚡ &f%player_ping% &7мс пинга'
      lore:
        - '&7Соединение с сервером'
      sort-group: 30

    date:
      display-name: '&7Дата'
      template: '&7▸ &f%server_time_dd% %server_time_MMM% %server_time_yyyy% &7дата'
      lore:
        - '&7Текущая дата'
      sort-group: 35

    time:
      display-name: '&7Время'
      template: '&7▸ &f%server_time_hh:mm:ss a% &7время'
      lore:
        - '&7Текущее время'
      sort-group: 35

    server_time:
      display-name: '&7Дата и время'
      template: '&7▸ &f%server_time_dd% %server_time_MMM%, %server_time_hh:mm:ss a% &7дата и время'
      lore:
