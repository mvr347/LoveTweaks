ender-chests:
  as-normal-chests: true

enchantments:
  disable-mending: true
  disable-all-enchantments: false

# ─── Кастомные зачарования (Кинжалы & Штаны) ──────────────────────────────────
# Поддерживает наковальню (PrepareAnvilEvent), точильный камень (PrepareGrindstoneEvent),
# хранение в PersistentDataContainer и отображение в лоре предмета.
# Кинжалы:
#   - iznurenie (Изнурение I-II): Накладывает Усталость I (3с) / II (3.5с) на цель
#   - socrushenie (Сокрушение I-II): Игнорирует 2 / 3 единицы брони цели
#   - raskol (Раскол I-II): При ударе по щиту — Слабость I + Замедление I/II + заморозка
#   - udar_ispodtishka (Удар исподтишка I-II): Бэкстаб — урон x1.4 / x1.7 + пробитие 2 брони
#   - ten (Тень I-II): Невидимость на 3с / 5с после убийства ударом в спину
#   - krovopiyca (Кровопийца): Восстанавливает 0.5 сердца при критическом ударе (несовместимо с Жаждой крови)
#   - zhazhda_krovi (Жажда крови I-II): Серия из 4 ударов даёт Регенерацию I / II на 3с (несовместимо с Кровопийцей)
# Штаны:
#   - prityazhenie (Притяжение I-II): Притягивает выпавшие предметы в радиусе 3 / 5 блоков к игроку
custom-enchantments:
  enabled: true
  # Разрешить зачарования кинжалов на всех ванильных мечах (по умолчанию только кинжалы)
  allow-on-all-swords: false

hunger:
  extra-exhaustion-per-second: 0.25
  saturation-multiplier: 0.5

milk:
  # Убирает только ванильное свойство молока "снимает все эффекты" (чтобы игроки пользовались
  # Зельем очищения ниже как единственным способом снять дебаффы) — само ведро молока при этом
  # честно расходуется как обычно (MilkListener#onEntityPotionEffect). 2026-09-26: раньше эта
  # настройка отменяла ВСЁ употребление ведра, из-за чего оно не расходовалось и молоко
  # фактически пилось бесконечно — исправлено.
  disable-milk: true
  # Зелье очищения — кастомный предмет, снимающий все активные эффекты при употреблении.
  # Поддерживает текстуры ItemsAdder, кулдаун (30 сек по умолчанию), частицы и крафт.
  purification-potion:
    material: POTION
    itemsadder-item: '' # ID предмета из ItemsAdder (например: 'custom_items:purification_potion')
    custom-model-data: 0
    name: '&bЗелье очищения'
    lore:
      - '&7Снимает все активные эффекты'
      - '&8Кулдаун: &f30 сек.'
    # Кулдаун между использованиями зелья в секундах
    cooldown-seconds: 30
    # Сообщение при попытке использовать во время кулдауна
    cooldown-message: '&cВы сможете использовать зелье очищения через <seconds> сек.'
    # Сообщение при успешном употреблении
    purification-message: '&bВы ощущаете очищение...'
    # Список эффектов, которые НЕ сбрасываются зельем очищения (например: BAD_OMEN, RAID_OMEN, TRIAL_OMEN)
    ignored-effects:
      - BAD_OMEN
      - RAID_OMEN
      - TRIAL_OMEN
    # Рецепт крафта на верстаке (бесформенный)
    recipe:
      enabled: true
      ingredients:
        - GHAST_TEAR
        - FERMENTED_SPIDER_EYE
        - NETHER_WART

# ─── Зельеварение и варочные стойки ──────────────────────────────────────────
# Полное отключение варочных стоек и варки зелий:
# - Блокировка крафта варочной стойки и всех рецептов варки зелий в ней
# - Блокировка размещения и использования варочных стоек
# - Удаление варочных стоек при генерации мира (структуры, деревни, иглу, корабли Края) и из сундуков
brewing:
  # Отключить варку любых зелий в варочной стойке
  disable-brewing: true
  # Отключить крафт варочной стойки
  disable-brewing-stand-craft: true
  # Отключить появление варочной стойки в мире (генерация в структурах, сундуки с лутом, установка блоков)
  disable-brewing-stand-world: true
  # Отключить естественное появление и выпадение зелий в мире (лут сундуков, дроп с мобов/ведьм, бартер пиглинов, рыбалка, жители)
  disable-potion-natural-drops: true
  # Сообщение при попытке взаимодействовать с варочной стойкой, поставить или скрафтить её
  disabled-message: '&cЗельеварение и варочные стойки отключены на этом сервере.'

# ─── Ванильные ограничения (Жалобы, Достижения, Друзья) ─────────────────────
vanilla:
  # Полное отключение ванильных достижений (Advancements):
  # Прогресс критериев блокируется, оповещения в чат скрываются, а все достижения обнуляются.
  disable-advancements: true
  # Полное отключение ванильной системы жалоб (Chat Reporting):
  # Сообщения отправляются без криптографических подписей игрока (как системные),
  # что делает невозможным отправку жалобы в Mojang через меню паузы или кнопку 'P'.
  disable-chat-reports: true
  # Отключение команд ванильных жалоб, достижений и друзей
  disable-friends-and-reports: true
  # Сообщение при попытке использовать отключенную команду
  disabled-command-message: '&cВанильные жалобы, достижения и система друзей отключены на этом сервере.'
  # Список блокируемых команд
  blocked-commands:
    - 'report'
    - 'chatreport'
    - 'wreport'
    - 'friend'
    - 'friends'
    - 'f'
    - 'advancement'
    - 'advancements'

# ─── Королевский Глашатай ─────────────────────────────────────────────────────
# NPC (Citizens), у которого любой игрок может купить слот объявления. До
# "slots" объявлений активны одновременно; раз в минуту Глашатай зачитывает
# в общий чат одно из них по очереди (round-robin), так что при трёх занятых
# слотах каждое конкретное сообщение повторяется примерно раз в 3 минуты.
# Текст объявления: подписанная книга, вложенная в меню (берётся первая
# страница), либо ввод в чат. Перед публикацией текст проверяется
# LoveChatFilter (см. его config.yml) — если словится плохое слово,
# объявление не публикуется, а деньги не возвращаются.
herald:
  enabled: true
  # ID NPC Citizens, привязывается командой /lovetweaksadmin herald bind (нужно смотреть на NPC)
  npc-id: -1
  npc-name: 'Глашатай Роберт'
  # Сколько объявлений может быть активно одновременно.
  slots: 3
  # Длительность объявления — игрок выбирает шагами duration-step-minutes
  # от min до max (кнопка-циклер в меню покупки).
  min-duration-minutes: 10
  max-duration-minutes: 60
  duration-step-minutes: 10
  # Максимальная длина текста объявления в символах.
  max-message-length: 50
  # Цена в единой валюте экосистемы (монеты LoveCore, см. его config.yml) — линейно
  # растёт с длительностью и длиной текста между min-cost (короткое, минимальная
  # длительность) и max-cost (максимум обоих). Число (медные единицы) или строка "2i" / "3i 50c"
  # (c = медная, i = железная, g = золотая, d = алмазная); общий индекс цен LoveCore применяется.
  # 2026-10-03: 50/300 → "2i"/"15i" (200 / 1 500) при номиналах LoveCore 1/100/2000/20000. Объявление на
  # весь сервер — реклама: короткое на 10 минут стоит пару железных, длинное на час — ощутимо, но
  # меньше золотой монеты (2 000), чтобы не превращать глашатая в роскошь.
  # 2026-10-14: "2i"/"15i" -> "15i"/"2g" (1 500 / 4 000 при номиналах LoveCore 1/100/2000/20000).
  # Решение владельца: глашатай был слишком дешёвым - объявление на весь сервер стоило пару железных
  # монет, и слоты занимали ради шутки, вытесняя настоящие объявления. Теперь даже короткое на 10
  # минут требует заметной суммы, а длинное на час стоит две золотые. Формула цены не менялась.
  min-cost: "15i"
  max-cost: "2g"

  gui:
    overview-title: '&6Королевский Глашатай'
    purchase-title: '&6Новое объявление'

    info:
      name: '&6Голос Королевства'
      lore:
        - '&7Оплаченное объявление транслируется'
        - '&7в общий чат по очереди с другими.'
        - '&7До &f<max> &7слотов одновременно.'

    slot-free:
      name: '&aСлот &f<index> &aсвободен'
      lore:
        - '&8&m─────────────────────'
        - '&aЛКМ &8— &7купить'

    slot-occupied:
      name: '&7Слот &f<index> &7занят'
      lore:
        - '&7Автор: &f<buyer>'
        - '&7Сообщение: &f<message>'
        - '&7Осталось: &f<remaining> мин.'

    # 2026-10-14: свободный слот, который игрок сейчас купить не может (слоты открываются по очереди,
    # у игрока уже есть объявление, нет экономики или не хватает даже на минимальное объявление).
    # Та же серая голова, что у confirm-no-funds, имя остаётся прежним (name пусто = имя из slot-free).
    # Причину <reason> подставляет код, тексты причин лежат в messages: reason-*.
    slot-unavailable:
      name: ''
      lore:
        - '&7Купить объявление в этом слоте'
        - '&8&m─────────────────────'
        - '&c✘ Недоступно сейчас'
        - '&7<reason>'
        - '&8&m─────────────────────'
        - '&aЛКМ &8— &7узнать причину'

    # Слот книги: подсказка (когда текст ещё не задан)
    book-hint:
      name: '&eВложите подписанную книгу'
      lore:
        - ''
        - '&7Перетащите книгу в этот слот —'
        - '&7текст возьмётся с первой страницы'
        - '&7(до <max> символов).'

    # Слот книги: текст задан через книгу
    book-active:
      name: '&aТекст из книги'
      lore:
        - '&8&m─────────────────────'
        - '&7Текст объявления:'
        - '&f<message>'
        - '&8&m─────────────────────'
        - '&6ПКМ &8— &7сбросить текст'

    # Слот книги: неактивен, так как текст задан через чат
    book-disabled:
      name: '&8Вложить книгу'
      lore:
        - ''
        - '&7Текст уже задан через чат.'
        - '&7Нажмите &fПКМ &7по кнопке чата,'
        - '&7чтобы сбросить его.'

    # Кнопка чата: подсказка (когда текст ещё не задан)
    write-chat-button:
      name: '&bНаписать в чат'
      lore:
        - '&8&m─────────────────────'
        - '&aЛКМ &8— &7ввести текст в чат'

    # Кнопка чата: текст задан через чат
    write-chat-active:
      name: '&aТекст из чата'
      lore:
        - '&8&m─────────────────────'
        - '&7Введённый текст:'
        - '&f<message>'
        - '&8&m─────────────────────'
        - '&aЛКМ &8— &7изменить текст'
        - '&6ПКМ &8— &7сбросить текст'

    # Кнопка чата: неактивна, так как текст задан через книгу
    write-chat-disabled:
      name: '&8Написать в чат'
      lore:
        - ''
        - '&7Текст уже задан через книгу.'
        - '&7Нажмите &fПКМ &7по слоту книги,'
        - '&7чтобы сбросить его.'

    duration-button:
      name: '&eДлительность: &f<minutes> мин.'
      lore:
        - '&8&m─────────────────────'
        - '&7Текущая цена: <cost>'
        - '&aЛКМ &8— &7изменить (<min>–<max> мин.)'
      # 2026-10-14: добавляется в лор, если на выбранный срок не хватает монет. Кнопка остаётся
      # кликабельной (на меньший срок денег может хватить), поэтому текстуру не меняем, только причина.
      unaffordable-lore:
        - '&8&m─────────────────────'
        - '&c✘ Не хватает монет на этот срок'

    confirm-button:
      name: '&aОпубликовать объявление'
      lore:
        - '&8&m─────────────────────'
        - '&7Текст: &f<message>'
        - '&7Длительность: &f<minutes> мин.'
        - '&7Цена: <cost>'
        - '&8&m─────────────────────'
        - '&aЛКМ &8— &7подтвердить и оплатить'

    confirm-disabled:
      name: '&8Опубликовать объявление'
      lore:
        - ''
        - '&cСначала добавьте текст объявления'

    # Кнопка подтверждения, если у игрока не хватает монет
    confirm-no-funds:
      name: '&cОпубликовать объявление'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzYxODczMWUwNjMzNzlhZWJmODJmMWQ2NGM0MTljOTBkN2YwYzE2NDhjNTQ4ZTliNjE1MWIxYmFiYTY2ZDcyMyJ9fX0='
      lore:
        - ''
        - '&7Текст: &f<message>'
        - '&7Длительность: &f<minutes> мин.'
        - '&7Цена: <cost>'
        - ''
        - '&c✘ Недоступно сейчас'
        - '&7<reason>'

    # Форматирование цены в физической валюте (монетах).
    # 2026-10-03: номиналы (id и стоимость) берутся из LoveCore; здесь — только тексты и цвета по id монеты.
    # value ниже используется лишь на сервере без LoveCore. Скрытая в LoveCore незеритовая монета не показывается.
    currency:
      separator: '&7, '
      coins:
        netherite_coin:
          value: 100000
          one: '&f%img_netherite_coin% &8<amount> незеритовая монета'
          few: '&f%img_netherite_coin% &8<amount> незеритовые монеты'
          many: '&f%img_netherite_coin% &8<amount> незеритовых монет'
        diamond_coin:
          value: 20000
          one: '&f%img_diamond_coin% &b<amount> алмазная монета'
          few: '&f%img_diamond_coin% &b<amount> алмазные монеты'
          many: '&f%img_diamond_coin% &b<amount> алмазных монет'
        gold_coin:
          value: 2000
          one: '&f%img_gold_coin% &e<amount> золотая монета'
          few: '&f%img_gold_coin% &e<amount> золотые монеты'
          many: '&f%img_gold_coin% &e<amount> золотых монет'
        iron_coin:
          value: 100
          one: '&f%img_iron_coin% &f<amount> железная монета'
          few: '&f%img_iron_coin% &f<amount> железные монеты'
          many: '&f%img_iron_coin% &f<amount> железных монет'
        copper_coin:
          value: 1
          one: '&f%img_copper_coin% &6<amount> медная монета'
          few: '&f%img_copper_coin% &6<amount> медные монеты'
          many: '&f%img_copper_coin% &6<amount> медных монет'

    messages:
      insufficient-funds: '&cНедостаточно монет для покупки (нужно <cost>).'
      too-long: '&cСлишком длинное сообщение (максимум <max> символов, у вас <length>).'
      empty-message: '&cОбъявление не может быть пустым.'
      # 2026-09-25: проверка фильтра чата (LoveChatFilter) теперь идёт ДО списания монет —
      # отклонённое объявление игроку ничего не стоит, поэтому текст про невозврат денег убран.
      rejected-profanity: '&cОбъявление отклонено фильтром чата.'
      published: '&aОбъявление опубликовано на <minutes> мин.!'
      chat-prompt: '&eВведите текст объявления в чат (до <max> символов), или "отмена":'
      chat-cancelled: '&7Ввод объявления отменён.'
      text-reset: '&7Текст объявления сброшен.'
      source-chat-active: '&cТекст уже задан через чат. Нажмите ПКМ по кнопке чата для сброса.'
      source-book-active: '&cТекст уже задан через книгу. Нажмите ПКМ по слоту книги для сброса.'
      # 2026-10-14: слоты открываются по очереди; ключи reason-* - причина на неактивной кнопке и в экшнбаре
      # при клике по ней (без цвета, цвет добавляет код).
      slot-occupied: '&cЭтот слот уже занят объявлением.'
      slot-locked: '&cСлот откроется, когда будет занят слот <prev>.'
      reason-slot-locked: 'Сначала должен быть занят слот <prev>'
      reason-already-owns-slot: 'У вас уже есть активное объявление'
      reason-no-funds: 'Недостаточно монет · нужно от <min>'
      reason-confirm-no-funds: 'Недостаточно монет · нужно <cost>'
      reason-no-economy: 'Экономика недоступна'
      no-permission: '&cУ вас нет прав для этой команды.'
      wrong-book: '&cСюда можно вложить только подписанную книгу.'
      no-free-slots: '&cСейчас все слоты Глашатая заняты.'
      # 2026-09-26: раньше не проверялось, что игрок уже владеет ДРУГИМ активным слотом — один
      # игрок мог выкупить сразу все 3 слота себе. Лимит теперь — один активный слот на игрока.
      already-owns-slot: '&cУ вас уже есть активное объявление в другом слоте Глашатая.'
      # 2026-10-04: у глашатая было три разных вида объявлений (покупные слоты, охота, контракты) и
      # ещё LoveShop рассылал караван/странника мимо него. Теперь общий префикс <prefix> стоит в
      # начале КАЖДОГО формата, а чужие плагины (LoveShop, LoveContracts) объявляют через
      # HeraldManager#announce — вид меняется в одном месте.
      prefix: '&7» &6Глашатай &7» '
      broadcast-format: '<prefix>&e<message>   &7« &f<buyer>'
      # 2026-09-29: смену дневных контрактов (LoveContracts) объявляет глашатай, а не строка в общем
      # чате; текст намеренно без команды /contracts — контракты берутся у NPC доски.
      contracts-rotation-format: '<prefix>&eВнимание! Новые контракты доступны на доске объявлений!'

# ─── Потеря/поломка предметов при выбрасывании ────────────────────────────────
# ─── Свиток телепортации ──────────────────────────────────────────────────────
# ПКМ → игрок вводит ник цели в чат → 5-секундный отсчёт (отменяется движением,
# невидимостью или PvP-меткой любой из сторон) → телепортация к цели.
teleport-scroll:
  item:
    # ID предмета из ItemsAdder (например: "lovetweaks:teleport_scroll" или "custom_scroll")
    # Если указан и ItemsAdder установлен — модель, текстура и кастомные свойства берутся из ItemsAdder.
    itemsadder-item: 'voidcore'
    # Ванильный материал (если itemsadder-item не задан)
    material: PAPER
    # CustomModelData (необязательно, если используется кастомный ресурс-пак)
    custom-model-data: 0
    name: '&6✦ Свиток телепортации ✦'
    lore:
      - '&7Позволяет телепортироваться к игроку'
      - ''
      - '&eПКМ&7 — использовать свиток'
  messages:
    prompt: '&6✦ Введите ник игрока в чат &e(10 секунд)'
    timeout: '&c✗ Время вышло!'
    player-not-found: '&c✗ Игрок &e<player>&c не найден или не в сети!'
    cannot-target-self: '&c✗ Нельзя телепортироваться к себе!'
    target-not-in-world: '&c✗ Игрок &e<player>&c находится в другом измерении! Телепортация возможна только в мир world.'
    target-afk: '&c✗ Игрок &e<player>&c АФК!'
    # 2026-09-25: раньше при срабатывании АФК-эвристики (нет движения по блокам 15+ секунд)
    # сообщение получал только инициатор - сама цель, к которой пытались телепортироваться,
    # не узнавала вообще ничего, хотя её "АФК-статус" ложно срабатывает как раз тогда, когда
    # она делает всё правильно - стоит на месте, ожидая телепортации, как и требует отсчёт.
    you-afk: '&c✗ &e<player>&c не смог телепортироваться к вам: вы слишком долго стояли без движения.'
    countdown-initiator: '&6✦ Телепортация через &e<seconds> сек&6... Не двигайтесь!'
    countdown-target: '&6✦ К вам телепортируется &e<player>&6... Не двигайтесь!'
    cancelled-initiator: '&c✗ Телепортация отменена! <reason>'
    cancelled-target: '&c✗ Телепортация отменена!'
    success-initiator: '&a✦ Телепортация выполнена!'
    success-target: '&e<player> &aтелепортировался к вам!'
    reason-moved-self: '(вы двигались)'
    reason-moved-target: '(<player> двигался)'
    reason-invisible-self: '(вы в невидимости)'
    reason-invisible-target: '(<player> в невидимости)'
    reason-pvp-self: '(вы в PvP)'
    reason-pvp-target: '(<player> в PvP)'
    reason-wrong-world: '(<player> не в мире world)'
    reason-dropped: '(свиток убран из руки)'
    # 2026-09-25: раньше эта отмена (не-PLUGIN телепорт инициатора — например, серверная
    # коррекция позиции "moved wrongly"/"moved too quickly", которая может сработать даже
    # когда игрок стоит на месте) была полностью тихой: отсчёт истекал, телепорт не
    # происходил, и ни инициатор, ни цель не получали вообще никакого сообщения.
    reason-teleported: '(вас телепортировало стороннее событие)'

# ─── Свиток телепортации к координатам ────────────────────────────────────────
# ПКМ со свитком → ввод координат в чат (X Z или X Y Z, 10 секунд) → отсчёт cast-time-seconds
# (отменяется движением/невидимостью/PvP/выбрасыванием) → телепортация в мир world.
# Выдаётся командой: /lovetweaksadmin givecoordscroll <игрок>
coord-teleport-scroll:
  enabled: true
  # Мир назначения (по умолчанию world)
  target-world: 'world'
  # Длительность отсчёта перед телепортацией (секунды). 0 — мгновенно
  cast-time-seconds: 5
  # Кулдаун повторного использования свитка (секунды). 0 — без кулдауна
  cooldown-seconds: 30

  # ─ Внешний вид предмета ───────────────────────────────────────────────────────
  item:
    # ID предмета из ItemsAdder (например: "lovetweaks:coord_teleport_scroll")
    itemsadder-item: 'voidcore:coord_teleport_scroll'
    material: PAPER
    # CustomModelData (необязательно)
    custom-model-data: 0
    name: '&b✦ Свиток телепортации: Координаты ✦'
    lore:
      - '&7Позволяет телепортироваться по координатам'
      - '&7в мире &fworld'
      - ''
      - '&eПКМ&7 — использовать свиток'

  # ─ Лимиты безопасности ────────────────────────────────────────────────────────
  limits:
    # Ниже этой высоты телепортация запрещена
    min-y: -64
    # Выше этой высоты телепортация запрещена
    max-y: 320
    # Точка назначения обязана лежать внутри границы мира (world border)
    respect-world-border: true
    # Максимальное расстояние от спавна (0 = не ограничивать)
    max-distance-from-spawn: 0
    # Разрешённые миры для использования
    allowed-worlds:
      - 'world'

  messages:
    prompt: '&b✦ Введите координаты в чат &e(X Z или X Y Z)&b, или "отмена" (10 секунд)'
    timeout: '&c✗ Время ожидания ввода координат истекло!'
    chat-cancelled: '&7Ввод координат отменён.'
    invalid-format: '&c✗ Неверный формат! Введите: <X> <Z> (например: 100 200) или <X> <Y> <Z>'
    world-not-allowed: '&c✗ Телепортация по координатам разрешена только в мире world!'
    destination-blocked: '&c✗ Точка назначения недоступна (вне границы мира или недопустимая высота)!'
    destination-water: '&c✗ Нельзя телепортироваться на воду! Выберите координаты на суше.'
    destination-underground: '&c✗ Нельзя телепортироваться под землю или в шахту! Телепортация разрешена только на поверхность суши.'
    destination-unsafe: '&c✗ Точка назначения опасна (лава, огонь или препятствия)!'
    no-permission: '&cУ вас нет прав на этот свиток!'
    on-cooldown: '&cЭтот свиток будет готов через &e<seconds> сек&c!'
    countdown: '&6✦ Телепортация через &e<seconds> сек&6... Не двигайтесь!'
    cancelled: '&c✗ Телепортация отменена! <reason>'
    success: '&a✦ Телепортация по координатам выполнена!'
    reason-moved: '(вы двигались)'
    reason-invisible: '(вы в невидимости)'
    reason-pvp: '(вы в PvP)'
    reason-dropped: '(свиток убран из руки)'
    # 2026-09-25: см. teleport-scroll.messages.reason-teleported — тот же случай тихой
    # отмены без единого сообщения игроку при не-PLUGIN телепорте во время отсчёта.
    reason-teleported: '(вас телепортировало стороннее событие)'

# ─── Стартовый набор ──────────────────────────────────────────────────────────
# Выдаётся один раз при самом первом заходе игрока на сервер.
first-join:
  enabled: true
  items:
    # teleport-scroll: true — выдаёт настоящий свиток телепортации (material/display-name/lore
    # игнорируются, используется предмет из items.TeleportScroll)
    - material: PAPER
      teleport-scroll: true
      amount: 1
    - material: IRON_SWORD
      amount: 1
      display-name: '&aНачальный меч'
      lore:
        - '&7Ваш первый меч на сервере'
    - material: COOKED_BEEF
      amount: 16
      display-name: '&6Запас еды'

# ─── Scoreboard ───────────────────────────────────────────────────────────────
scoreboard:
  # Название скорборда (§-коды или &-коды, всегда отображается как заголовок)
  title: '&FVOIDCORE'
  # Строка-разделитель между названием/парами плейсхолдеров (по умолчанию пустая строка)
  separator: ''
  # Нижняя строка скорборда. Автоматически центрируется и расширяет скорборд
  # с безопасными отступами по бокам, чтобы крайние символы никогда не съедались.
  bottom: '&c✌ &7V O I D C O R E &c✌'
  # Интервал обновления в тиках (20 = 1 секунда)
  update-interval: 20
  # Максимальное кол-во плейсхолдеров, которые игрок может включить одновременно.
  # Плейсхолдеры отображаются на скорборде парами (по 2 в ряд), каждая пара
  # завершается строкой-разделителем — при 8 плейсхолдерах получится ровно
  # 8 строк + 4 разделителя = 12 строк тела скорборда.
  # Потолок 8 жёсткий (2026-10-14): ровно столько нумерованных карточек-слотов помещается в меню
  # (2x4), а клиентский скорборд не вмещает больше 15 строк. Значение больше 8 будет урезано до 8.
  max-placeholders: 8
  # Миры, в которых скорборд не отображается
  disabled-worlds: []

  # Категории скорборда (2026-10-14): меню /scoreboard теперь делится на категории вместо одного
  # длинного списка из ~40 строк — иначе игрок тонул бы в кнопках. Порядок здесь = порядок кнопок
  # в ряду категорий (слоты 37-43, влезает максимум 7). icon (необязательно) — своя голова вместо
  # общей из gui.category-button.
  categories:
    general:
      display-name: '&bОбщее'
      lore:
        - '&7Координаты, мир, пинг, дата и время'
    reputation:
      display-name: '&dРепутация'
      lore:
        - '&7Карма, стиль игры и пометки'
    combat:
      display-name: '&cБой'
      lore:
        - '&7Убийства, смерти и дуэли'
    clans:
      display-name: '&6Кланы'
      lore:
        - '&7Данные вашего клана'
    hunt:
      display-name: '&2Охота'
      lore:
        - '&7Ранг охотника и заказы'
    craft:
      display-name: '&eРемесло'
      lore:
        - '&7Пивоварение и адаптации'
    activities:
      display-name: '&aАктивности'
      lore:
        - '&7Контракты, мини-игры и приваты'

  # Быстрые раскладки (2026-10-14): одна кнопка в шапке меню заменяет весь текущий набор.
  # Раскладка нужна, потому что собирать табло по одной строке из 40 долго, а большинству
  # игроков нужен один из 3-4 типовых наборов. В шапке 6 слотов управления, один занят
  # переключателем вида — поэтому раскладок максимум 5 (лишние игнорируются).
  # placeholders: id строки или id:номер_варианта (с нуля). Строки, которые игроку сейчас
  # недоступны (нет клана, не установлен плагин), при применении пропускаются, а в лоре кнопки
  # помечены заранее. Лимит строк (max-placeholders) тоже соблюдается.
  default-preset: standard
  presets:
    standard:
      name: '&6Стандартная'
      lore:
        - '&7Базовый набор для повседневной игры'
      placeholders: [coords, datetime:2, playtime, karma, clan_tag, ping]
    small:
      name: '&6Маленькая'
      lore:
        - '&7Только координаты и время'
      placeholders: [coords, datetime:1]
    combat:
      name: '&6Боевая'
      lore:
        - '&7Статистика боёв и охоты'
      placeholders: [kills, deaths, kd_ratio, duel_honor, duels:1, hunt_rank]
    clan:
      name: '&6Клановая'
      lore:
        - '&7Данные вашего клана'
      placeholders: [clan_tag, clan_role, clan_level, clan_influence, clan_territories]

  # Плейсхолдеры скорборда — каждый плейсхолдер это одна строка.
  # Используются ТОЛЬКО кешированные параметры PAPI (2026-10-14): скорборд обновляется каждую
  # секунду для каждого игрока на главном потоке, поэтому параметры с запросами в БД
  # (например, часть lovecontracts и wanderer_deal_* в loveshop) сюда не подключаем.
  # category: id категории из блока categories выше.
  # variants (необязательно): несколько форматов одной строки, переключаются Shift+ЛКМ.
  #   Вместо variants можно написать один template — это один безымянный формат.
  # Если расширение PAPI, которое использует шаблон (%id_...%), не зарегистрировано
  #   (плагин не установлен) — строка в меню серая с причиной «Плагин не установлен»
  #   и на табло не показывается. Так не получается сырого «%id_param%» на экране.
  # requirement (необязательно): плейсхолдер блокируется в GUI и пропускается на
  #   скорборде, пока не выполнено условие.
  #     placeholder: PAPI-выражение для проверки, например '%clans_in_clan%'
  #     equals (необязательно): требуемое значение; если не указано — условие
  #       считается выполненным, если PAPI вернул непустой результат
  #     reason: причина блокировки, показывается в лоре кнопки
  # Старое поле sort-group больше не нужно: оно заменено на category (при его наличии без
  #   category строка попадёт в категорию по таблице 0→general, 5/20→reputation, 10→clans,
  #   30→combat, 35→general).
  placeholders:
    # ── Общее ──
    coords:
      display-name: '&bКоординаты'
      # Свой %lovetweaks_*%, а не %player_x%: не зависит от расширения Player
      template: '&6x &b%lovetweaks_x%&r, &6y &b%lovetweaks_y%&r, &6z &b%lovetweaks_z%'
      lore:
        - '&7Текущие координаты игрока'
      category: general

    world:
      display-name: '&bМир'
      template: '&b▸ &f%lovetweaks_world% &7мир'
      lore:
        - '&7Мир, в котором вы находитесь'
      category: general

    ping:
      display-name: '&7Пинг'
      template: '&7⚡ &f%lovetweaks_ping% &7мс пинга'
      lore:
        - '&7Соединение с сервером'
      category: general

    # Дата и время слиты в одну строку (2026-10-14): раньше были три отдельные кнопки
    # (date/time/server_time), которые занимали три слота ради одного и того же.
    # Время 24-часовое (HH:mm), а не «hh:mm a»: 12-часовой формат с AM/PM читался плохо,
    # а месяц текстом (MMM) мог выйти по-английски — поэтому дата числовая dd.MM.yyyy.
    datetime:
      display-name: '&7Дата и время'
      lore:
        - '&7Дата и время сервера'
        - '&8Shift+ЛКМ — сменить формат'
      category: general
      variants:
        - name: 'Дата'
          template: '&7▸ &f%server_time_dd.MM.yyyy% &7дата'
        - name: 'Время'
          template: '&7▸ &f%server_time_HH:mm% &7время'
        - name: 'Дата и время'
          template: '&7▸ &f%server_time_dd.MM.yyyy HH:mm%'

    # %playtime_formatted% вместо %playtime_since_join% (2026-10-14): since_join отдавал ВСЕ
    # часы целиком, поэтому у новичков строка «0 часов на сервере» висела первые 59 минут.
    playtime:
      display-name: '&bВремя в игре'
      lore:
        - '&7Всё время, проведённое на сервере'
        - '&8Shift+ЛКМ — сменить формат'
      category: general
      variants:
        - name: 'Всего'
          template: '&b⏱ &f%playtime_formatted% &7в игре'
        - name: 'Эта сессия'
          template: '&b⏱ &f%playtime_session_formatted% &7текущая сессия'

    first_join:
      display-name: '&7Первый вход'
      template: '&7▸ &f%playtime_first_join% &7первый вход'
      lore:
        - '&7Дата вашего первого входа на сервер'
      category: general

    # ── Репутация ──
    karma:
      display-name: '&eКарма'
      lore:
        - '&7Очки кармы (вежливости) на сервере'
        - '&8Shift+ЛКМ — сменить формат'
      category: reputation
      variants:
        - name: 'Очки'
          template: '&e⚖ &f%lovebehavior_politeness_points% &7очков кармы'
        - name: 'Ранг'
          template: '&e⚖ &f%lovebehavior_politeness_name% &7ранг кармы'

    # Требование убрано (2026-10-14): оно проверяло, что плейсхолдер вообще что-то возвращает,
    # а LoveBehavior возвращает значение всегда — то есть условие никогда не блокировало.
    behavior:
      display-name: '&8Стиль игры'
      template: '&8☯ &f%lovebehavior_playstyle_name% &7стиль игры'
      lore:
        - '&7Ваш текущий стиль игры'
      category: reputation

    suffix:
      display-name: '&dПометка'
      template: '&d✦ &f%lovesubnames_current% &7пометка'
      lore:
        - '&7Текущая пометка (суффикс) игрока'
      category: reputation
      requirement:
        placeholder: '%lovesubnames_current%'
