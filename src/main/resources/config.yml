ender-chests:
  # Превращает эндер-сундук в обычный сундук (общее хранилище блока, не личный инвентарь)
  as-normal-chests: true

enchantments:
  # Полностью убирает зачарование "Починка" из всех источников
  disable-mending: true
  # Отключить ВСЕ зачарования (более радикальный вариант)
  disable-all-enchantments: false

achievements:
  # Отменять прогресс ванильных достижений (advancements)
  disable-vanilla-achievements: false
  # Список ID кастомных достижений
  custom-achievement-ids:
    - first_diamond
    - dragon_slayer
    - deep_miner

custom-achievements:
  first_diamond:
    name: "Алмазный первопроходец"
    description: "Добудьте первый алмаз"
    icon: DIAMOND
    criteria:
      - "BREAK_BLOCK:DIAMOND_ORE:1"

  dragon_slayer:
    name: "Убийца дракона"
    description: "Победите Эндер-дракона"
    icon: DRAGON_EGG
    criteria:
      - "KILL_ENTITY:ENDER_DRAGON:1"

  deep_miner:
    name: "Шахтёр глубин"
    description: "Сломайте 500 блоков камня"
    icon: STONE
    criteria:
      - "BREAK_BLOCK:STONE:500"

hunger:
  # Дополнительное истощение в секунду (0.25 — между лёгким и средним усложнением)
  extra-exhaustion-per-second: 0.25
  # Множитель насыщения от еды (0.5 = вдвое меньше ванили)
  saturation-multiplier: 0.5

milk:
  # Отключить молоко (не будет снимать эффекты)
  disable-milk: true
